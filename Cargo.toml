[package]
name = "awsdiag"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Fast, compact AWS diagnostic data acquisition, shaped for an AI agent and rendered into a single self-contained HTML report."
repository = "https://github.com/Ghost-Assembly/awsdiag"
readme = "README.md"
keywords = ["aws", "cloudwatch", "diagnostics", "logs", "observability"]
categories = ["command-line-utilities", "development-tools::debugging"]
# Not published to crates.io. The output envelope is not a stable public API
# yet, and adding `license` and `description` above removed the only thing
# that was accidentally preventing a `cargo publish`.
publish = false
exclude = ["/docs", "/tests/browser", "/playwright.config.mjs", "/.github"]

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sdk-cloudwatch = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "1.150.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ec2 = { version = "1.254.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# `default-features = false` drops the SDK's on-by-default `rustls` feature,
# which selects the legacy hyper-0.14 + rustls-0.21 stack and drags in
# rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). `default-https-client`
# uses the current aws-lc path instead. Every aws-sdk-* crate added later
# needs the same treatment -- `just security` is what catches a regression.
aws-sdk-sts = { version = "1.114.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sigv4a",
] }
aws-smithy-types = "1.6.3"
aws-types = "1.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
globset = "0.4.20"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
