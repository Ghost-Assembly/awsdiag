<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>__UPLOT_CSS__</style>
<style>
/* Tokens are defined on :root for light and overridden for dark, so no
   colour has its only definition inside a media query. */
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1a1a19; --muted:#6b6b68; --line:#e3e3df;
  --accent:#2f6f9f; --warn:#b3541e; --bad:#a32b2b; --good:#2d7a4f;
  --code:#f4f4f1;
  --s1:#2f6f9f; --s2:#b3541e; --s3:#2d7a4f; --s4:#7d5ba6; --s5:#a32b2b;
  --s6:#1c8c8c; --s7:#8a7100; --s8:#c2557a;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --panel:#1d1f23; --ink:#e8e8e6; --muted:#9a9a96; --line:#2e3136;
    --accent:#6ba8d6; --warn:#e0925c; --bad:#e0736f; --good:#6fbf90;
    --code:#232629;
    --s1:#6ba8d6; --s2:#e0925c; --s3:#6fbf90; --s4:#b295d6; --s5:#e0736f;
    --s6:#5cc4c4; --s7:#ccb04a; --s8:#e08fab;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
header.top{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-0.01em}
.sub{color:var(--muted);font-size:13px}
h2{font-size:16px;margin:32px 0 10px;letter-spacing:-0.01em}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;margin-bottom:14px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.sev{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);
  vertical-align:middle;margin-left:8px}
.sev.critical,.sev.high{color:var(--bad);border-color:var(--bad)}
.sev.warning,.sev.medium{color:var(--warn);border-color:var(--warn)}
.sev.info,.sev.low{color:var(--accent);border-color:var(--accent)}
.chart{margin-bottom:6px}
.chart h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
button.pill{font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
button.pill[aria-pressed="true"]{color:var(--panel);border-color:transparent}
button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:12px;margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;
  border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--code)}
td.tmpl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  overflow-wrap:anywhere}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);white-space:nowrap}
.tag.new{color:var(--bad);border-color:var(--bad)}
.tag.spiking{color:var(--warn);border-color:var(--warn)}
pre{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:10px;
  overflow-x:auto;font-size:12px;margin:8px 0 0}
.detail td{background:var(--code)}
.streams{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
input.search{font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:340px}
input.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty{color:var(--muted);font-style:italic}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}
.u-legend{font-size:12px}
.u-legend .u-marker{width:9px;height:9px;border-radius:2px}
footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);
  padding-top:12px}
@media print{
  body{background:#fff}
  section.panel{break-inside:avoid;border-color:#ccc}
  .controls,input.search,.hint{display:none}
  tr.detail{display:table-row !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </header>
  <main id="main"></main>
  <footer>Generated by awsdiag — self-contained, no network access required.</footer>
</div>

<script id="awsdiag-data" type="application/json">__DATA__</script>
<script>__UPLOT_JS__</script>
<script>
"use strict";
(function () {
  const el = (t, cls, txt) => {
    const n = document.createElement(t);
    if (cls) n.className = cls;
    // textContent throughout: report content includes raw log lines, which
    // are written by whatever produced the logs. Nothing here uses innerHTML.
    if (txt !== undefined) n.textContent = txt;
    return n;
  };

  let data;
  try {
    data = JSON.parse(document.getElementById("awsdiag-data").textContent);
  } catch (e) {
    document.getElementById("main").append(el("p", "empty", "Report data could not be parsed."));
    return;
  }

  document.getElementById("title").textContent = data.title || "Report";
  const subBits = [];
  if (data.subtitle) subBits.push(data.subtitle);
  if (data.window) subBits.push(data.window.since + " → " + data.window.until);
  // Say so explicitly: a reader cannot tell UTC from local by looking at a chart.
  if ((data.charts || []).length) subBits.push("times in UTC");
  document.getElementById("subtitle").textContent = subBits.join(" · ");

  const main = document.getElementById("main");
  const token = name =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const PALETTE = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
  // Read on demand rather than frozen at load: if the OS theme flips, every
  // CSS colour changes but a cached palette would leave canvas strokes and
  // pill backgrounds on the old one.
  const colourAt = i => token(PALETTE[i % PALETTE.length]);

  function panel(parent) { const s = el("section", "panel"); parent.append(s); return s; }
  function heading(text) { const h = el("h2", null, text); main.append(h); return h; }

  // ---- findings ---------------------------------------------------------
  if (data.summary || (data.sections && data.sections.length)) {
    heading("Findings");
    if (data.summary) panel(main).append(el("div", "prose", data.summary));
    (data.sections || []).forEach(s => {
      const p = panel(main);
      const h = el("h3", null, s.heading);
      h.style.margin = "0 0 6px";
      h.style.fontSize = "14px";
      if (s.severity) h.append(el("span", "sev " + String(s.severity).toLowerCase(), s.severity));
      p.append(h, el("div", "prose", s.body));
    });
  }

  // ---- charts -----------------------------------------------------------
  const declared = (data.charts || []).filter(Boolean);
  const charts = declared.filter(c => c.rows && c.rows.length);
  if (declared.length) {
    heading("Metrics");
    const holder = panel(main);
    const controls = el("div", "controls");
    holder.append(controls);

    const events = (data.events || [])
      .map(e => ({ t: Date.parse(e.ts) / 1000, label: e.label }))
      .filter(e => Number.isFinite(e.t));

    // Vertical markers for deploys and change events, drawn across every
    // chart so a spike lines up with what caused it.
    const markerPlugin = {
      hooks: {
        draw: u => {
          if (!events.length) return;
          const ctx = u.ctx;
          ctx.save();
          const muted = token("--muted");
          ctx.strokeStyle = muted;
          ctx.fillStyle = muted;
          ctx.setLineDash([3, 3]);
          ctx.lineWidth = 1;
          ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
          events.forEach(e => {
            const x = u.valToPos(e.t, "x", true);
            if (x < u.bbox.left || x > u.bbox.left + u.bbox.width) return;
            ctx.beginPath();
            ctx.moveTo(x, u.bbox.top);
            ctx.lineTo(x, u.bbox.top + u.bbox.height);
            ctx.stroke();
            // Label the line itself. A list of names under the chart cannot
            // be matched to lines once there is more than one marker.
            ctx.save();
            ctx.setLineDash([]);
            ctx.translate(x + 3, u.bbox.top + 2);
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText(e.label, 0, 0);
            ctx.restore();
          });
          ctx.restore();
        }
      }
    };

    const plots = [];
    // One colour per series *name*, shared by every chart and by the pill.
    // Assigning from a running counter gave the same resource a different
    // colour in each chart while its pill matched only the first -- actively
    // misleading in a report whose purpose is comparing across panels.
    const names = [...new Set(charts.flatMap(c => c.series || []))];
    const colourFor = name => colourAt(names.indexOf(name));

    // Iterate everything declared, in the author's order. A separate pass for
    // empty charts put a placeholder ahead of charts declared before it, and
    // the order a report presents its panels in is the author's argument.
    declared.forEach(c => {
      const box = el("div", "chart");
      if (!c.rows || !c.rows.length) {
        // Say when a metric was asked for and came back empty. Dropping it
        // silently is the same hazard as drawing a gap as zero: the reader
        // cannot tell "queried and empty" from "never queried".
        box.append(el("h3", null, c.unit ? c.title + " (" + c.unit + ")" : c.title));
        box.append(el("div", "empty", "No data returned for this metric in the window."));
        holder.append(box);
        return;
      }
      box.append(el("h3", null, c.unit ? c.title + " (" + c.unit + ")" : c.title));
      holder.append(box);

      // A single NaN in the x column makes uPlot draw nothing at all, while
      // axes and gridlines still render -- so a malformed timestamp reads as
      // "this metric reported no data" rather than "your input is wrong".
      // The same care the value column already takes, applied to the axis.
      const usable = c.rows.filter(r => Number.isFinite(Date.parse(r.ts)));
      const dropped = c.rows.length - usable.length;
      const xs = usable.map(r => Date.parse(r.ts) / 1000);
      const cols = [xs];
      (c.series || []).forEach(name => {
        cols.push(usable.map(r => {
          const v = r[name];
          // null, undefined and non-numbers are all gaps. Coercing to 0 would
          // turn "not reporting" into "reported zero", which reads as healthy.
          return typeof v === "number" && Number.isFinite(v) ? v : null;
        }));
      });

      const seriesOpts = [{}].concat((c.series || []).map(name => ({
        label: name, stroke: colourFor(name), width: 1.5, spanGaps: false,
        points: { show: false }
      })));

      if (dropped) {
        box.append(el("div", "hint",
          dropped + " row" + (dropped === 1 ? "" : "s") + " skipped: unparsable timestamp"));
      }
      if (!usable.length) {
        box.append(el("div", "empty", "No rows in this chart had a usable timestamp."));
        return;
      }

      const plot = new uPlot({
        title: "",
        width: box.clientWidth || 1100,
        height: 190,
        cursor: {
          // One sync key for every chart: hovering anywhere shows the value
          // at that instant on all of them, which is what makes comparing
          // resources possible rather than just adjacent.
          sync: { key: "awsdiag", setSeries: true },
          drag: { x: true, y: false, setScale: true }
        },
        legend: { live: true },
        scales: { x: { time: true } },
        // Axes in UTC. uPlot defaults to the viewer's local zone, which put
        // "6:00am" on the axis while the header said 09:30Z -- one document
        // disagreeing with itself by the timezone offset, in a report whose
        // whole purpose is establishing when things happened.
        tzDate: ts => uPlot.tzDate(new Date(ts * 1000), "UTC"),
        series: seriesOpts,
        plugins: [markerPlugin],
        hooks: {
          // Brush-zoom on one chart rescales all of them, or the shared time
          // axis stops being shared the moment anyone zooms.
          setScale: [
            (u, key) => {
              if (key !== "x" || u._syncing) return;
              const { min, max } = u.scales.x;
              plots.forEach(p => {
                if (p === u) return;
                p._syncing = true;
                p.setScale("x", { min, max });
                p._syncing = false;
              });
            }
          ]
        }
      }, cols, box);
      plots.push(plot);
    });

    // Series toggles apply across every chart that carries the series.
    const uniq = names;
    if (uniq.length > 1) {
      uniq.forEach((name, i) => {
        const b = el("button", "pill", name);
        b.type = "button";
        b.setAttribute("aria-pressed", "true");
        const colour = colourFor(name);
        b.style.background = colour;
        b.style.borderColor = colour;
        b.style.color = token("--panel");
        b.addEventListener("click", () => {
          const on = b.getAttribute("aria-pressed") !== "true";
          b.setAttribute("aria-pressed", String(on));
          b.style.background = on ? colour : "transparent";
          b.style.color = on ? token("--panel") : token("--muted");
          // Keyed on the plot's own series, not on a positional index into
          // the declared list -- those diverge as soon as one chart is empty
          // and has no plot.
          plots.forEach(p => {
            p.series.forEach((ser, si) => {
              if (si > 0 && ser.label === name) p.setSeries(si, { show: on });
            });
          });
        });
        controls.append(b);
      });
    }
    // Outside the multi-series branch: brush-zoom works with one series too,
    // and a control nobody knows exists may as well not.
    controls.append(el("span", "hint",
      uniq.length > 1
        ? "drag to zoom · double-click to reset · click a series to hide it"
        : "drag to zoom · double-click to reset"));

    const resize = () => plots.forEach((p, i) => {
      const w = p.root.parentElement.clientWidth;
      if (w) p.setSize({ width: w, height: 190 });
    });
    window.addEventListener("resize", resize);
    resize();
  }

  // ---- log clusters -----------------------------------------------------
  const clusters = data.clusters || [];
  if (clusters.length) {
    heading("Log clusters");
    const p = panel(main);
    const controls = el("div", "controls");
    const search = el("input", "search");
    search.type = "search";
    search.placeholder = "filter templates, streams and exemplars…";
    search.setAttribute("aria-label", "Filter log clusters");
    controls.append(search);
    const count = el("span", "hint", "");
    controls.append(count);
    p.append(controls);

    const table = el("table");
    const thead = el("thead");
    const hr = el("tr");
    [["", null], ["status", "status"], ["count", "count"], ["first seen", "first_seen"],
     ["template", null]].forEach(([label, key]) => {
      const th = el("th", null, label);
      if (key) { th.dataset.sort = key; th.title = "Sort by " + label; }
      hr.append(th);
    });
    thead.append(hr);
    const tbody = el("tbody");
    table.append(thead, tbody);
    p.append(table);

    let sortKey = "count", sortDesc = true;

    const spark = h => {
      const max = Math.max(1, ...h);
      const w = 90, ht = 18, n = h.length || 1;
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", w); svg.setAttribute("height", ht);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "activity over the window");
      h.forEach((v, i) => {
        const bh = Math.max(v > 0 ? 1 : 0, Math.round((v / max) * ht));
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", (i * (w / n)).toFixed(2));
        r.setAttribute("y", ht - bh);
        r.setAttribute("width", Math.max(1, w / n - 0.5).toFixed(2));
        r.setAttribute("height", bh);
        r.setAttribute("fill", "currentColor");
        r.setAttribute("opacity", "0.6");
        svg.append(r);
      });
      return svg;
    };

    const haystack = c => [
      c.template, c.cluster_id, c.status,
      (c.by_stream || []).map(s => s.stream).join(" "),
      c.exemplar ? c.exemplar.message : ""
    ].join(" ").toLowerCase();

    function render() {
      const q = search.value.trim().toLowerCase();
      const rows = clusters
        .filter(c => !q || haystack(c).includes(q))
        .sort((a, b) => {
          const av = a[sortKey], bv = b[sortKey];
          const cmp = typeof av === "number" && typeof bv === "number"
            ? av - bv
            : String(av === undefined ? "" : av).localeCompare(String(bv === undefined ? "" : bv));
          return sortDesc ? -cmp : cmp;
        });

      tbody.textContent = "";
      count.textContent = rows.length + " of " + clusters.length + " clusters";
      if (!rows.length) {
        const tr = el("tr");
        const td = el("td", "empty", "No clusters match that filter.");
        td.colSpan = 5;
        tr.append(td);
        tbody.append(tr);
        return;
      }

      rows.forEach(c => {
        const tr = el("tr", "row");
        tr.tabIndex = 0;
        const sc = el("td");
        sc.append(spark(c.histogram || []));
        const st = el("td");
        if (c.status) st.append(el("span", "tag " + String(c.status).toLowerCase(), c.status));
        const cnt = el("td", "num", String(c.count));
        const seen = el("td", "num", c.first_seen ? String(c.first_seen).replace("T", " ").replace("Z", "") : "");
        const tmpl = el("td", "tmpl", c.template);
        tr.append(sc, st, cnt, seen, tmpl);

        const detail = el("tr", "detail");
        detail.hidden = true;
        const dtd = el("td");
        dtd.colSpan = 5;
        if (c.exemplar) {
          dtd.append(el("div", "hint", c.exemplar.ts + " · " + c.exemplar.stream));
          dtd.append(el("pre", null, c.exemplar.message));
        }
        if ((c.by_stream || []).length) {
          const streams = el("div", "streams");
          c.by_stream.forEach(s => streams.append(el("span", "tag", s.stream + " · " + s.count)));
          if (c.other_streams) streams.append(el("span", "tag", "+" + c.other_streams + " more"));
          dtd.append(streams);
        }
        if (!dtd.childNodes.length) dtd.append(el("div", "empty", "No exemplar recorded."));
        detail.append(dtd);

        const toggle = () => { detail.hidden = !detail.hidden; };
        tr.addEventListener("click", toggle);
        tr.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });
        tbody.append(tr, detail);
      });
    }

    search.addEventListener("input", render);
    thead.querySelectorAll("th[data-sort]").forEach(th => {
      th.addEventListener("click", () => {
        const k = th.dataset.sort;
        if (k === sortKey) sortDesc = !sortDesc; else { sortKey = k; sortDesc = true; }
        render();
      });
    });
    render();
  }

  // ---- appendix ---------------------------------------------------------
  if ((data.appendix || []).length) {
    heading("Appendix");
    data.appendix.forEach(a => {
      const p = panel(main);
      const d = el("details");
      d.append(el("summary", null, a.title), el("pre", null, a.content));
      p.append(d);
    });
  }

  if (!main.childNodes.length) {
    main.append(el("p", "empty", "This report contains no findings, charts or clusters."));
  }
})();
</script>
</body>
</html>
