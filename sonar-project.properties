# SonarQube Cloud analysis configuration.
#
# projectKey and organization are assigned by SonarQube Cloud when the repo is
# imported. These are the values it generates for a GitHub-linked project by
# convention; correct them here if the import produced something different.
sonar.projectKey=Ghost-Assembly_awsdiag
sonar.organization=ghost-assembly

sonar.sources=src,assets
sonar.tests=tests

# The vendored uPlot build is third-party, minified, and 51 KB on one line.
# Analysing it produces nothing actionable and would dominate the duplication
# and complexity metrics for the whole project.
sonar.exclusions=assets/vendor/**

# Rust.
#
# Sonar's Rust analyzer *is* Clippy. Rather than let it run its own pass with
# its own flags, import the report from the exact invocation CI already gates
# on -- `--all-targets --all-features` -- so the two can never disagree about
# what was checked.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy-report.json
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
sonar.rust.cargo.manifestPaths=Cargo.toml
