# Versions only. Dependencies stay with cargo; commands stay in the justfile.
# CI reads this same file via jdx/mise-action, so local and CI agree by
# construction.
[tools]
rust = "1.98.1"
just = "1.58.0"
# `just test-browser` runs Playwright through npx. Pinned here so CI and a
# workstation use the same Node rather than whatever the runner image ships.
node = "24"

# Security tooling used by `just security`. Pinned here rather than assumed
# present, so a clean machine and a CI runner get the same versions and a
# tool upgrade is a reviewable change rather than a surprise.
# cargo-audit and cargo-deny are installed with `cargo install --locked` at
# pinned versions; see the "Install security tooling" step in ci.yml.
gitleaks = "8.30.1"
actionlint = "1.7.12"
zizmor = "1.30.1"
